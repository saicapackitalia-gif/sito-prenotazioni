<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width">
<title>ERP Logistica</title>

<!-- ✅ FIREBASE CORRETTO -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#eef2f7;
}

header {
  background:#1e3a8a;
  color:white;
  padding:12px;
  text-align:center;
  font-weight:bold;
}

/* LOGIN */
#login {
  padding:20px;
}

#login input {
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#1e3a8a;
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* CALENDAR */
.calendar {
  display:flex;
  overflow-x:auto;
  padding:10px;
  gap:8px;
}

.day {
  min-width:70px;
  background:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
}

.day.active {
  background:#1e3a8a;
  color:white;
}

/* DASHBOARD */
.dashboard {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  padding:10px;
}

.boxStat {
  background:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

/* TABLE */
.table {
  display:grid;
  grid-template-columns:70px 1fr 1fr;
}

.cell {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

.free {background:#bbf7d0;}
.medium {background:#fde68a;}
.full {background:#ef4444;color:white;}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  justify-content:center;
  align-items:center;
}

.modal-box {
  background:white;
  padding:15px;
  width:90%;
  max-width:300px;
  border-radius:10px;
}

.modal-box input {
  width:100%;
  padding:10px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>ERP Logistica</header>

<!-- LOGIN -->
<div id="login">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div id="calendar" class="calendar"></div>

<div class="dashboard">
<div class="boxStat">Camion<br><span id="tot">0</span></div>
<div class="boxStat">Fogli<br><span id="fogli">0</span></div>
<div class="boxStat">Scatole<br><span id="scatole">0</span></div>
</div>

<div id="table" class="table"></div>

<button onclick="logout()">Logout</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="modal-box">
<input id="trasp" placeholder="Trasportatore">
<input id="dest" placeholder="Destinazione">
<button onclick="save()">Salva</button>
</div>
</div>

<script>

/* ✅ FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDQ5QefY2T8eGhh46TmSNHyt9dcEf7A_C8",
  authDomain: "magazzino-carichi.firebaseapp.com",
  projectId: "magazzino-carichi"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const LIMIT = 2;

let selectedDate="";
let selectedTime="";
let selectedZone="";

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  )
  .then(() => alert("Login riuscito"))
  .catch(e => alert(e.message));
}

function register(){
  auth.createUserWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  )
  .then(() => alert("Registrazione completata"))
  .catch(e => alert(e.message));
}

function logout(){
  auth.signOut();
  location.reload();
}

/* CONTROLLO LOGIN */
auth.onAuthStateChanged(user=>{
 if(user){
   document.getElementById("login").style.display="none";
   document.getElementById("app").style.display="block";
   loadCalendar();
 }
});

/* CALENDARIO */
function loadCalendar(){
 let c=document.getElementById("calendar");
 c.innerHTML="";
 let today=new Date();

 for(let i=0;i<10;i++){
  let d=new Date();
  d.setDate(today.getDate()+i);

  let el=document.createElement("div");
  el.className="day";
  el.innerText=d.getDate();

  el.onclick=()=>{
    selectedDate=d.toISOString().split("T")[0];
    document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    loadData();
  };

  c.appendChild(el);
 }
}

/* LOAD */
async function loadData(){

 let snap=await db.collection("bookings")
  .where("date","==",selectedDate)
  .get();

 let data=snap.docs.map(d=>d.data());

 document.getElementById("tot").innerText=data.length;
 document.getElementById("fogli").innerText=data.filter(x=>x.zone=="Fogli").length;
 document.getElementById("scatole").innerText=data.filter(x=>x.zone=="Scatole").length;

 let table=document.getElementById("table");
 table.innerHTML="<div class='cell'>Ora</div><div class='cell'>Fogli</div><div class='cell'>Scatole</div>";

 let h=6,m=0;

 while(true){

  let time = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");

  table.innerHTML+=`<div class="cell">${time}</div>`;

  ["Fogli","Scatole"].forEach(zone=>{

    let list=data.filter(x=>x.time==time && x.zone==zone);
    let cell=document.createElement("div");

    if(list.length==0){
      cell.className="cell free";
      cell.innerText="LIBERO";
      cell.onclick=()=>{
        selectedTime=time;
        selectedZone=zone;
        document.getElementById("modal").style.display="flex";
      };
    }
    else if(list.length<LIMIT){
      cell.className="cell medium";
      cell.innerText=list.length+" camion";
    }
    else{
      cell.className="cell full";
      cell.innerText="PIENO";
    }

    table.appendChild(cell);

  });

  m+=30;
  if(m==60){m=0;h++;}
  if(h==20) break;
 }
}

/* SAVE */
async function save(){
 await db.collection("bookings").add({
  date:selectedDate,
  time:selectedTime,
  zone:selectedZone,
  trasp:document.getElementById("trasp").value,
  dest:document.getElementById("dest").value
 });

 document.getElementById("modal").style.display="none";
 loadData();
}

</script>

</body>
</html>
