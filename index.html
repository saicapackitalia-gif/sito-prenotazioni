<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prenotazione Carichi</title>

<style>
body {font-family:Arial;margin:0;background:#f4f4f4;}

h1 {
  background:#0078D4;
  color:white;
  padding:15px;
  text-align:center;
}

.container {padding:10px;}

.controls {
  text-align:center;
  margin-bottom:10px;
}

button {
  padding:10px 15px;
  margin:5px;
  font-size:16px;
}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day {
  background:white;
  padding:10px;
  text-align:center;
  border:1px solid #ccc;
  cursor:pointer;
}

.weekend { background:#eee;color:#aaa; }
.selected { background:#0078D4;color:white; }

.grid {
  display:grid;
  grid-template-columns:80px 1fr 1fr;
  margin-top:10px;
}

.slot {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

.free { background:#b9f7b9; cursor:pointer; }
.busy { background:#f5b5b5; }

.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
}

.modal-content {
  background:white;
  padding:20px;
  margin:100px auto;
  width:90%;
  max-width:300px;
  border-radius:8px;
}
</style>

</head>
<body>

<h1>Prenotazione Carichi</h1>

<div class="container">

<div class="controls">
  <button onclick="prevMonth()">◀</button>
  <span id="monthLabel"></span>
  <button onclick="nextMonth()">▶</button>
</div>

<div id="calendar" class="calendar"></div>

<div class="grid" id="grid"></div>

</div>

<!-- POPUP -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Nuova Prenotazione</h3>
    <input id="trasportatore" placeholder="Trasportatore"><br><br>
    <input id="destinazione" placeholder="Destinazione"><br><br>
    <button onclick="salvaPrenotazione()">✅ Salva</button>
    <button onclick="chiudiModal()">❌ Annulla</button>
  </div>
</div>

<script>

let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
let selectedDate = "";
let selectedTime = "";
let selectedZone = "";

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

// -------- CALENDARIO --------
function aggiornaCalendario(){

  let cal = document.getElementById("calendar");
  cal.innerHTML="";

  document.getElementById("monthLabel").innerText =
    new Date(currentYear,currentMonth).toLocaleString('it',{month:'long',year:'numeric'});

  let giorni = new Date(currentYear,currentMonth+1,0).getDate();

  for(let i=1;i<=giorni;i++){

    let data = new Date(currentYear,currentMonth,i);
    let div = document.createElement("div");

    div.innerText = i;
    div.className="day";

    if(data.getDay()==0 || data.getDay()==6){
      div.classList.add("weekend");
    } else {
      div.onclick=function(){
        selectedDate=data.toISOString().split("T")[0];
        document.querySelectorAll(".day").forEach(d=>d.classList.remove("selected"));
        div.classList.add("selected");
        creaSlot();
      };
    }

    cal.appendChild(div);
  }
}

function prevMonth(){
  currentMonth--;
  if(currentMonth<0){currentMonth=11; currentYear--;}
  aggiornaCalendario();
}

function nextMonth(){
  currentMonth++;
  if(currentMonth>11){currentMonth=0; currentYear++;}
  aggiornaCalendario();
}

// -------- SLOT --------
function creaSlot(){

  let grid = document.getElementById("grid");

  grid.innerHTML=`
    <div><b>Ora</b></div>
    <div><b>Fogli</b></div>
    <div><b>Scatole</b></div>
  `;

  let h=6,m=0;

  while(true){

    let time = String(h).padStart(2,'0')+":"+String(m).padStart(2,'0');

    grid.innerHTML+=`<div class="slot">${time}</div>`;

    ["Fogli","Scatole"].forEach(zona=>{

      let div=document.createElement("div");

      let b=bookings.find(x=>x.date==selectedDate && x.time==time && x.zone==zona);

      if(b){
        div.className="slot busy";
        div.innerHTML=`<b>${b.trasportatore}</b><br>${b.destinazione}
        <br><button onclick="cancella('${b.id}')">🗑</button>`;
      } else {
        div.className="slot free";
        div.innerText="LIBERO";
        div.onclick=function(){
          selectedTime=time;
          selectedZone=zona;
          document.getElementById("modal").style.display="block";
        };
      }

      grid.appendChild(div);

    });

    m+=30;
    if(m==60){m=0;h++;}
    if(h==20) break;

  }
}

// -------- SALVA --------
function salvaPrenotazione(){

  let t=document.getElementById("trasportatore").value;
  let d=document.getElementById("destinazione").value;

  if(!t || !d){ alert("Compila tutto"); return; }

  bookings.push({
    id: Date.now(),
    date:selectedDate,
    time:selectedTime,
    zone:selectedZone,
    trasportatore:t,
    destinazione:d
  });

  localStorage.setItem("bookings",JSON.stringify(bookings));

  chiudiModal();
  creaSlot();
}

// -------- CANCELLA --------
function cancella(id){
  bookings=bookings.filter(b=>b.id!=id);
  localStorage.setItem("bookings",JSON.stringify(bookings));
  creaSlot();
}

function chiudiModal(){
  document.getElementById("modal").style.display="none";
  document.getElementById("trasportatore").value="";
  document.getElementById("destinazione").value="";
}

// AVVIO
aggiornaCalendario();

</script>

</body>
</html>
