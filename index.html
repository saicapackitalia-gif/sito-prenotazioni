<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Baie Carico</title>

<style>
body {
  margin:0;
  font-family: system-ui;
  background:#eef3f8;
}

header {
  background:#1e3a8a;
  color:white;
  text-align:center;
  padding:15px;
  font-size:20px;
  font-weight:bold;
}

.container {
  padding:10px;
}

/* calendario */
.calendar {
  display:flex;
  gap:10px;
  overflow-x:auto;
}

.day {
  min-width:70px;
  padding:10px;
  background:white;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
}

.day.active {
  background:#1e3a8a;
  color:white;
}

/* slot grid */
.grid {
  margin-top:10px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card {
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.free { background:#bbf7d0; }
.busy { background:#fecaca; }

/* bottoni */
button {
  margin-top:6px;
  padding:8px;
  width:100%;
  border:none;
  border-radius:6px;
  background:#1e3a8a;
  color:white;
}

/* popup */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  justify-content:center;
  align-items:center;
}

.box {
  background:white;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:300px;
}

.box input {
  width:100%;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>Gestione Baie</header>

<div class="container">
  <div id="calendar" class="calendar"></div>
  <div id="slots" class="grid"></div>
</div>

<div id="modal" class="modal">
  <div class="box">
    <h3>Nuova prenotazione</h3>
    <input id="trasp" placeholder="Trasportatore">
    <input id="dest" placeholder="Destinazione">
    <button onclick="save()">Salva</button>
    <button onclick="closeModal()">Chiudi</button>
  </div>
</div>

<script>

/* ✅ DATABASE AUTOMATICO (senza setup) */
const STORAGE_KEY = "BOOKINGS_GLOBAL";

/* Simulazione sincronizzazione */
function getBookings(){
  return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
}

function setBookings(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* stato */
let bookings = getBookings();

let selectedDate="";
let selectedTime="";
let selectedZone="";

/* ascolta aggiornamenti tra schede */
window.addEventListener("storage", () => {
  bookings = getBookings();
  load();
});

/* calendario */
function calendar(){
  let cal = document.getElementById("calendar");
  cal.innerHTML="";

  let today=new Date();

  for(let i=0;i<10;i++){
    let d=new Date();
    d.setDate(today.getDate()+i);

    let el=document.createElement("div");
    el.className="day";

    el.innerHTML = `
      <b>${d.getDate()}</b><br>
      ${d.toLocaleDateString("it",{weekday:"short"})}
    `;

    if(d.getDay()!=0 && d.getDay()!=6){
      el.onclick=()=>{
        selectedDate=d.toISOString().split("T")[0];

        document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
        el.classList.add("active");

        load();
      };
    } else {
      el.style.opacity=0.4;
    }

    cal.appendChild(el);
  }
}

/* slot */
function load(){

  bookings = getBookings();

  let cont=document.getElementById("slots");
  cont.innerHTML="";

  let h=6,m=0;

  while(true){

    let time = (h+"").padStart(2,"0")+":"+ (m+"").padStart(2,"0");

    ["Fogli","Scatole"].forEach(zone=>{

      let el=document.createElement("div");

      let found = bookings.find(b=>b.date===selectedDate && b.time===time && b.zone===zone);

      if(found){
        el.className="card busy";
        el.innerHTML = `
          ${time} ${zone}<br><br>
          <b>${found.trasp}</b><br>
          ${found.dest}
          <button onclick="remove(${found.id})">Cancella</button>
        `;
      } else {
        el.className="card free";
        el.innerHTML = `${time}<br>${zone}<br><b>LIBERO</b>`;

        el.onclick=()=>{
          selectedTime=time;
          selectedZone=zone;
          openModal();
        };
      }

      cont.appendChild(el);
    });

    m+=30;
    if(m===60){m=0;h++;}
    if(h===20) break;

  }
}

/* salva */
function save(){

  let t=document.getElementById("trasp").value;
  let d=document.getElementById("dest").value;

  if(!t||!d){
    alert("Compila i campi");
    return;
  }

  bookings = getBookings();

  bookings.push({
    id:Date.now(),
    date:selectedDate,
    time:selectedTime,
    zone:selectedZone,
    trasp:t,
    dest:d
  });

  setBookings(bookings);

  closeModal();
  load();
}

/* cancella */
function remove(id){
  bookings = getBookings().filter(b=>b.id!==id);
  setBookings(bookings);
  load();
}

/* modal */
function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* start */
calendar();

</script>

</body>
</html>
