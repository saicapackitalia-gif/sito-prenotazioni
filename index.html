<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width">
<title>ERP Logistica</title>

https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js>
https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js>
https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.jsscript>

<style>
body {margin:0;font-family:Arial;background:#eef2f7;}
header {background:#1e3a8a;color:white;padding:12px;text-align:center;font-weight:bold;}

.calendar {display:flex;overflow:auto;padding:10px;gap:6px;}
.day {min-width:70px;background:white;padding:10px;border-radius:8px;text-align:center;}
.day.active {background:#1e3a8a;color:white;}

.dashboard {
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:8px;
 padding:10px;
}

.boxStat {
 background:white;
 padding:10px;
 border-radius:8px;
 text-align:center;
 font-weight:bold;
}

.table {display:grid;grid-template-columns:70px 1fr 1fr;}

.cell {border:1px solid #ccc;padding:8px;text-align:center;}

.free {background:#bbf7d0;}
.medium {background:#fde68a;}
.full {background:#ef4444;color:white;}

button {width:100%;padding:6px;margin-top:4px;}

.modal {
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 justify-content:center;
 align-items:center;
}

.modal-box {
 background:white;
 padding:15px;
 width:90%;
 max-width:300px;
}
.modal input {width:100%;padding:8px;margin-top:6px;}
</style>

</head>

<body>

<header>ERP Logistica</header>

<div id="login">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<div id="app" style="display:none">

<div class="calendar" id="calendar"></div>

<div class="dashboard">
<div class="boxStat">Camion<br><span id="tot">0</span></div>
<div class="boxStat">Fogli<br><span id="fogli">0</span></div>
<div class="boxStat">Scatole<br><span id="scatole">0</span></div>
</div>

<div id="table" class="table"></div>

<button onclick="logout()">Logout</button>

</div>

<div id="modal" class="modal">
<div class="modal-box">
<input id="trasp" placeholder="Trasportatore">
<input id="dest" placeholder="Destinazione">
<button onclick="save()">Salva</button>
</div>
</div>

<script>

/* 🔑 INSERISCI QUI SOLO LE CHIAVI */
const firebaseConfig = {
 apiKey: "INSERISCI",
 authDomain:"INSERISCI",
 projectId:"INSERISCI"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const LIMIT = 2;
const ADMIN="admin@azienda.com";

let selectedDate="";
let selectedTime="";
let selectedZone="";

/* LOGIN */
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value);
}
function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value);
}
function logout(){auth.signOut(); location.reload();}

auth.onAuthStateChanged(user=>{
 if(user){
  login.style.display="none";
  app.style.display="block";
  loadCalendar();
 }
});

/* CALENDARIO */
function loadCalendar(){
 let c=document.getElementById("calendar");
 c.innerHTML="";
 let today=new Date();

 for(let i=0;i<10;i++){
  let d=new Date();
  d.setDate(today.getDate()+i);

  let el=document.createElement("div");
  el.className="day";
  el.innerText=d.getDate();

  if(d.getDay()!=0 && d.getDay()!=6){
   el.onclick=()=>{
    selectedDate=d.toISOString().split("T")[0];
    document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    loadData();
   };
  }

  c.appendChild(el);
 }
}

/* LOAD DATA ERP */
async function loadData(){

 let snap=await db.collection("bookings")
  .where("date","==",selectedDate)
  .get();

 let data=snap.docs.map(d=>({id:d.id,...d.data()}));

 /* DASHBOARD */
 tot.innerText=data.length;
 fogli.innerText=data.filter(x=>x.zone=="Fogli").length;
 scatole.innerText=data.filter(x=>x.zone=="Scatole").length;

 let table=document.getElementById("table");
 table.innerHTML="<div>Ora</div><div>Fogli</div><div>Scatole</div>";

 let h=6,m=0;

 while(true){

  let time=h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0");

  table.innerHTML+=`<div class='cell'>${time}</div>`;

  ["Fogli","Scatole"].forEach(zone=>{

    let list=data.filter(x=>x.time==time && x.zone==zone);
    let cell=document.createElement("div");

    if(list.length==0){
      cell.className="cell free";
      cell.innerText="LIBERO";
      cell.onclick=()=>{
        selectedTime=time;
        selectedZone=zone;
        modal.style.display="flex";
      };
    }
    else if(list.length<LIMIT){
      cell.className="cell medium";
      cell.innerHTML=list.map(x=>x.trasp).join("<br>");
    }
    else{
      cell.className="cell full";
      cell.innerHTML="PIENO";
    }

    table.appendChild(cell);

  });

  m+=30; if(m==60){m=0;h++;}
  if(h==20) break;
 }
}

/* SAVE */
async function save(){

 await db.collection("bookings").add({
  date:selectedDate,
  time:selectedTime,
  zone:selectedZone,
  trasp:trasp.value,
  dest:dest.value
 });

 modal.style.display="none";
 loadData();
}

</script>

</body>
</html>
