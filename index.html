<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Firebase</title>

<!-- ✅ QUESTO È IL PUNTO CHIAVE -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.jsscript>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

button {
  background: #1e3a8a;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>Test Login</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">Registrati</button>
<button onclick="loginUser()">Login</button>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDQ5QefY2T8eGhh46TmSNHyt9dcEf7A_C8",
  authDomain: "magazzino-carichi.firebaseapp.com",
  projectId: "magazzino-carichi"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function registerUser(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert("✅ Registrato"))
    .catch(e => alert(e.message));
}

function loginUser(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("✅ Login OK"))
    .catch(e => alert(e.message));
}

</script>

</body>
</html>
