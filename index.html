<!DOCTYPE html>
<html lang="it">
<head>
<meta name="viewport" content="width=device-width">
<title>Planning Baie</title>

https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js>
https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js
https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
body {margin:0;font-family:Arial;background:#f2f5f9;}

header {
  background:#1e3a8a;
  color:white;
  padding:12px;
  text-align:center;
  font-size:18px;
}

/* login */
.login {
  padding:20px;
}

.login input {
  width:100%;
  padding:12px;
  margin-top:10px;
}

/* calendario */
.calendar {
  display:flex;
  overflow-x:auto;
  padding:10px;
  gap:8px;
}

.day {
  min-width:70px;
  background:white;
  padding:10px;
  text-align:center;
  border-radius:8px;
  border:2px solid transparent;
}

.day.active {
  border:2px solid #1e3a8a;
  background:#dbeafe;
}

/* planning */
.table {
  display:grid;
  grid-template-columns:80px 1fr 1fr;
}

.header {
  background:#ddd;
  padding:10px;
  text-align:center;
  font-weight:bold;
}

.cell {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

.free {background:#bbf7d0;}
.busy {background:#fecaca;}

button {
  width:100%;
  padding:8px;
  margin-top:5px;
  background:#1e3a8a;
  color:white;
  border:none;
}

.modal {
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  justify-content:center;
  align-items:center;
}

.box {
  background:white;
  padding:20px;
  width:90%;
  max-width:300px;
}

.box input {
  width:100%;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>Planning Baie Carico</header>

<!-- LOGIN -->
<div id="login" class="login">
<h3>Accesso</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="calendar" id="calendar"></div>

<div id="table" class="table"></div>

<button onclick="logout()">Logout</button>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
<div class="box">
<input id="trasp" placeholder="Trasportatore">
<input id="dest" placeholder="Destinazione">
<button onclick="save()">Salva</button>
<button onclick="closeModal()">Chiudi</button>
</div>
</div>

<script>

/* 🔑 INSERISCI LE TUE CHIAVI FIREBASE */
const firebaseConfig = {
  apiKey: "INSERISCI QUI",
  authDomain: "INSERISCI QUI",
  projectId: "INSERISCI QUI"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN = "admin@azienda.com";

let selectedDate="", selectedTime="", selectedZone="";

/* LOGIN */
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value)
 .catch(e=>alert(e.message));
}

function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .catch(e=>alert(e.message));
}

function logout(){
 auth.signOut();
 location.reload();
}

auth.onAuthStateChanged(user=>{
 if(user){
  login.style.display="none";
  app.style.display="block";
  loadCalendar();
 }
});

/* CALENDARIO */
function loadCalendar(){
 let cal=document.getElementById("calendar");
 cal.innerHTML="";
 let today=new Date();

 for(let i=0;i<10;i++){
  let d=new Date();
  d.setDate(today.getDate()+i);

  let div=document.createElement("div");
  div.className="day";

  div.innerHTML = `${d.getDate()}<br>${d.toLocaleDateString("it",{weekday:"short"})}`;

  if(d.getDay()!=0 && d.getDay()!=6){
   div.onclick=()=>{
    selectedDate=d.toISOString().split("T")[0];
    document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
    div.classList.add("active");
    loadTable();
   };
  }

  cal.appendChild(div);
 }
}

/* TABLE */
async function loadTable(){

 let snap = await db.collection("bookings").where("date","==",selectedDate).get();
 let data = snap.docs.map(d=>({id:d.id,...d.data()}));

 let table=document.getElementById("table");
 table.innerHTML="";

 table.innerHTML += `<div class="header">Ora</div><div class="header">Fogli</div><div class="header">Scatole</div>`;

 let h=6,m=0;

 while(true){

  let time = h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0");

  table.innerHTML += `<div class="cell">${time}</div>`;

  ["Fogli","Scatole"].forEach(zone=>{

    let found=data.find(x=>x.time==time && x.zone==zone);
    let cell=document.createElement("div");
    cell.className="cell";

    if(found){
      cell.classList.add("busy");

      let btn="";
      if(auth.currentUser.email===ADMIN){
        btn=`<button onclick="del('${found.id}')">X</button>`;
      }

      cell.innerHTML=`${found.trasp}<br>${found.dest}${btn}`;

    } else {
      cell.classList.add("free");
      cell.innerHTML="LIBERO";
      cell.onclick=()=>{
        selectedTime=time;
        selectedZone=zone;
        modal.style.display="flex";
      };
    }

    table.appendChild(cell);
  });

  m+=30;
  if(m==60){m=0;h++;}
  if(h==20) break;
 }
}

/* SAVE */
async function save(){
 let t=trasp.value;
 let d=dest.value;

 if(!t||!d){alert("Compila"); return;}

 await db.collection("bookings").add({
  date:selectedDate,
  time:selectedTime,
  zone:selectedZone,
  trasp:t,
  dest:d,
  user:auth.currentUser.email
 });

 closeModal();
 loadTable();
}

/* DELETE */
async function del(id){
 if(auth.currentUser.email!==ADMIN) return;
 await db.collection("bookings").doc(id).delete();
 loadTable();
}

function closeModal(){
 modal.style.display="none";
}

</script>

</body>
</html>
