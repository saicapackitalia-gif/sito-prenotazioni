<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Carichi</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#eef2f7;
}

header {
  background:#1e40af;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container {
  padding:10px;
}

/* CALENDARIO */
.calendar {
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
}

.day {
  min-width:70px;
  padding:12px;
  background:white;
  text-align:center;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.day.active {
  background:#1e40af;
  color:white;
}

/* SLOT */
.grid {
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.card {
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-size:16px;
  font-weight:bold;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.free {
  background:#bbf7d0;
}

.busy {
  background:#fecaca;
}

label {
  font-size:12px;
  display:block;
  margin-top:5px;
  color:#333;
}

button {
  padding:10px;
  margin-top:8px;
  width:100%;
  border:none;
  border-radius:6px;
  background:#1e40af;
  color:white;
  font-size:14px;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  align-items:center;
  justify-content:center;
}

.box {
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:320px;
}

.box input {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
</style>

</head>

<body>

<header>Gestione Carichi</header>

<div class="container">
<div id="calendar" class="calendar"></div>
<div id="slots" class="grid"></div>
</div>

<!-- POPUP -->
<div id="modal" class="modal">
  <div class="box">
    <h3>Nuova prenotazione</h3>
    <input id="trasp" placeholder="Trasportatore">
    <input id="dest" placeholder="Destinazione">
    <button onclick="salva()">✅ Conferma</button>
    <button onclick="chiudi()">❌ Annulla</button>
  </div>
</div>

<script>

let bookings = JSON.parse(localStorage.getItem("bookings")||"[]");

let selectedDate="";
let selectedTime="";
let selectedZone="";

// CALENDARIO
function calendar(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";
  let oggi=new Date();

  for(let i=0;i<10;i++){

    let d=new Date();
    d.setDate(oggi.getDate()+i);

    let div=document.createElement("div");
    div.className="day";

    div.innerHTML = `
      ${d.getDate()}<br>
      <small>${d.toLocaleDateString("it",{weekday:"short"})}</small>
    `;

    if(d.getDay()!=0 && d.getDay()!=6){

      div.onclick=()=>{
        selectedDate = d.toISOString().split("T")[0];

        document.querySelectorAll(".day").forEach(el=>el.classList.remove("active"));
        div.classList.add("active");

        load();
      };

    } else {
      div.style.opacity="0.4";
    }

    cal.appendChild(div);
  }
}

// CARICA SLOT
function load(){

  let cont=document.getElementById("slots");
  cont.innerHTML="";

  let h=6,m=0;

  while(true){

    let time = h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0");

    ["Fogli","Scatole"].forEach(zone=>{

      let div=document.createElement("div");

      let b=bookings.find(x=>x.date==selectedDate && x.time==time && x.zone==zone);

      if(b){

        div.className="card busy";

        div.innerHTML = `
          ${time} - ${zone}<br><br>
          ${b.trasp}<br>
          ${b.dest}
          <button onclick="del(${b.id})">🗑 Cancella</button>
        `;

      } else {

        div.className="card free";

        div.innerHTML = `
          ${time} - ${zone}<br><br>
          LIBERO
        `;

        div.onclick=()=>{
          selectedTime=time;
          selectedZone=zone;
          apri();
        };

      }

      cont.appendChild(div);

    });

    m+=30;
    if(m==60){m=0;h++;}
    if(h==20) break;
  }
}

// SALVA
function salva(){

  let t=document.getElementById("trasp").value;
  let d=document.getElementById("dest").value;

  if(!t || !d){
    alert("Compila tutti i campi");
    return;
  }

  let esiste=bookings.find(x=>x.date==selectedDate && x.time==selectedTime && x.zone==selectedZone);

  if(esiste){
    alert("Slot già occupato!");
    return;
  }

  bookings.push({
    id:Date.now(),
    date:selectedDate,
    time:selectedTime,
    zone:selectedZone,
    trasp:t,
    dest:d
  });

  localStorage.setItem("bookings", JSON.stringify(bookings));

  chiudi();
  load();
}

// CANCELLA
function del(id){
  bookings = bookings.filter(x=>x.id!=id);
  localStorage.setItem("bookings", JSON.stringify(bookings));
  load();
}

// MODAL
function apri(){
  document.getElementById("modal").style.display="flex";
}

function chiudi(){
  document.getElementById("modal").style.display="none";
  document.getElementById("trasp").value="";
  document.getElementById("dest").value="";
}

// AVVIO
calendar();

</script>

</body>
</html>
