<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Carichi</title>

<style>

body {
  margin:0;
  font-family: Arial;
  background:#eef1f6;
}

header {
  background:#1e40af;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container {
  padding:10px;
}

/* CALENDARIO */
.calendar {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
}

.day {
  min-width:65px;
  padding:10px;
  text-align:center;
  background:white;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
}

.day.active {
  border:2px solid #1e40af;
  background:#dbeafe;
}

/* SLOT */
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card {
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-size:14px;
}

.free {
  background:#bbf7d0;
}

.busy {
  background:#fecaca;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  align-items:center;
  justify-content:center;
}

.modal-box {
  background:white;
  padding:20px;
  width:90%;
  max-width:320px;
  border-radius:12px;
}

.modal input {
  width:100%;
  padding:10px;
  margin-top:10px;
}

.modal button {
  width:100%;
  margin-top:10px;
  padding:12px;
}

</style>
</head>

<body>

<header>Gestione Carichi</header>

<div class="container">

<div id="calendar" class="calendar"></div>

<div id="slots" class="grid"></div>

</div>

<!-- POPUP -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Nuova Prenotazione</h3>
    <input id="trasp" placeholder="Trasportatore">
    <input id="dest" placeholder="Destinazione">
    <button onclick="salva()">✅ Conferma</button>
    <button onclick="chiudi()">❌ Annulla</button>
  </div>
</div>

<script>

// DATI
let bookings = JSON.parse(localStorage.getItem("bookings")||"[]");

let selectedDate="";
let selectedTime="";
let selectedZone="";

// CALENDARIO
function creaCalendario(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let today=new Date();

  for(let i=0;i<14;i++){

    let d=new Date();
    d.setDate(today.getDate()+i);

    let div=document.createElement("div");
    div.className="day";

    div.innerHTML = `
      <b>${d.getDate()}</b><br>
      ${d.toLocaleDateString('it',{weekday:'short'})}
    `;

    if(d.getDay()!=0 && d.getDay()!=6){

      div.onclick=()=>{
        selectedDate=d.toISOString().split("T")[0];

        document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
        div.classList.add("active");

        caricaSlot();
      };

    } else {
      div.style.opacity="0.4";
    }

    cal.appendChild(div);
  }
}

// SLOT
function caricaSlot(){

  let container=document.getElementById("slots");
  container.innerHTML="";

  let h=6,m=0;

  while(true){

    let time = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");

    ["Fogli","Scatole"].forEach(zone=>{

      let div=document.createElement("div");

      let b=bookings.find(x=>x.date==selectedDate && x.time==time && x.zone==zone);

      if(b){

        div.className="card busy";
        div.innerHTML = `
          <b>${b.trasp}</b><br>
          ${b.dest}<br>
          ${time} ${zone}<br><br>
          <button onclick="cancella(${b.id})">🗑 Cancella</button>
        `;

      } else {

        div.className="card free";
        div.innerHTML = `
          ${time}<br>
          ${zone}<br><br>
          <b>LIBERO</b>
        `;

        div.onclick=()=>{
          selectedTime=time;
          selectedZone=zone;
          apri();
        };

      }

      container.appendChild(div);

    });

    m+=30;
    if(m==60){m=0;h++;}
    if(h==20) break;
  }
}

// MODAL
function apri(){
  document.getElementById("modal").style.display="flex";
}

function chiudi(){
  document.getElementById("modal").style.display="none";
}

// SALVA
function salva(){

  let t=document.getElementById("trasp").value;
  let d=document.getElementById("dest").value;

  if(!t||!d){ alert("Compila tutto"); return; }

  bookings.push({
    id:Date.now(),
    date:selectedDate,
    time:selectedTime,
    zone:selectedZone,
    trasp:t,
    dest:d
  });

  localStorage.setItem("bookings",JSON.stringify(bookings));

  chiudi();
  caricaSlot();
}

// CANCELLA
function cancella(id){
  bookings=bookings.filter(x=>x.id!=id);
  localStorage.setItem("bookings",JSON.stringify(bookings));
  caricaSlot();
}

// START
creaCalendario();

</script>

</body>
</html>
