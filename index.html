<style>
body { font-family:Arial; padding:20px; }
input, button { width:100%; padding:12px; margin-top:10px; }
button { background:#1e3a8a; color:white; border:none; }
</style>
</head>

<body>

<h2>Login Test</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">Registrati</button>
<button onclick="loginUser()">Login</button>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDQ5QefY2T8eGhh46TmSNHyt9dcEf7A_C8",
  authDomain: "magazzino-carichi.firebaseapp.com",
  projectId: "magazzino-carichi"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function registerUser(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, pass)
    .then(() => alert("✅ Registrato"))
    .catch(e => alert(e.message));
}

function loginUser(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
    .then(() => alert("✅ Login OK"))
    .catch(e => alert(e.message));
}

</script>

</body>
</html>
