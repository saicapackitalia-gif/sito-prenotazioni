<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Firebase</title>

<!-- ✅ QUESTE SONO LE RIGHE GIUSTE -->
https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #eef2f7;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}
button {
  background: #1e3a8a;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>Login Test</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="registerUser()">Registrati</button>
<button onclick="loginUser()">Login</button>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDQ5QefY2T8eGhh46TmSNHyt9dcEf7A_C8",
  authDomain: "magazzino-carichi.firebaseapp.com",
  projectId: "magazzino-carichi"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function registerUser(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email,password)
    .then(()=>alert("✅ Registrazione riuscita"))
    .catch(e=>alert(e.message));
}

function loginUser(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email,password)
    .then(()=>alert("✅ Login riuscito"))
    .catch(e=>alert(e.message));
}

</script>

</body>
</html>
