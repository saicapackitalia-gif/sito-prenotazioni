<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Carichi</title>

<style>
body {
  font-family: Arial;
  margin:0;
  background:#eef1f5;
}

header {
  background:#1e3a8a;
  color:white;
  padding:15px;
  text-align:center;
  font-size:20px;
}

.container {
  padding:10px;
}

.calendar {
  display:flex;
  overflow-x:auto;
  gap:8px;
  margin-bottom:10px;
}

.day {
  min-width:60px;
  padding:10px;
  background:white;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
  border:2px solid transparent;
}

.day.active {
  border:2px solid #1e3a8a;
  background:#dbeafe;
}

.dayslot {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.slot {
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.free {
  background:#bbf7d0;
}

.busy {
  background:#fecaca;
}

.slot button {
  margin-top:5px;
}

.modal {
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);

  align-items:center;
  justify-content:center;
}

.modal-box {
  background:white;
  padding:20px;
  width:90%;
  max-width:320px;
  border-radius:12px;
}

.modal input {
  width:100%;
  padding:10px;
  margin-top:10px;
}

.modal button {
  width:100%;
  margin-top:10px;
  padding:12px;
}
</style>
</head>

<body>

<header>Gestione Carichi</header>

<div class="container">

<div id="calendar" class="calendar"></div>
<div id="slots" class="dayslot"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Prenotazione</h3>
    <input id="trasp" placeholder="Trasportatore">
    <input id="dest" placeholder="Destinazione">
    <button onclick="saveBooking()">✅ Conferma</button>
    <button onclick="closeModal()">❌ Annulla</button>
  </div>
</div>

<script>

let bookings = JSON.parse(localStorage.getItem("bookings")||"[]");

let selectedDate="";
let selectedTime="";
let selectedZone="";

// -------- CALENDARIO MOBILE --------
function createCalendar(){

  let cal=document.getElementById("calendar");
  cal.innerHTML="";

  let today=new Date();

  for(let i=0;i<10;i++){
    let d=new Date();
    d.setDate(today.getDate()+i);

    let div=document.createElement("div");
    div.className="day";
    div.innerText=d.getDate();

    if(d.getDay()!=0 && d.getDay()!=6){

      div.onclick=()=>{
        selectedDate=d.toISOString().split("T")[0];

        document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
        div.classList.add("active");

        loadSlots();
      };

    } else {
      div.style.opacity="0.4";
    }

    cal.appendChild(div);
  }
}

// -------- SLOT --------
function loadSlots(){

  let container=document.getElementById("slots");
  container.innerHTML="";

  let h=6, m=0;

  while(true){

    let time = String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");

    ["Fogli","Scatole"].forEach(zone=>{

      let slot=document.createElement("div");

      let b=bookings.find(x=>x.date==selectedDate && x.time==time && x.zone==zone);

      if(b){
        slot.className="slot busy";
        slot.innerHTML = `
          <b>${b.trasp}</b><br>
          ${b.dest}<br>
          ${time} ${zone}<br>
          <button onclick="deleteBooking(${b.id})">🗑</button>
        `;
      } else {
        slot.className="slot free";
        slot.innerHTML = `${time}<br>${zone}<br>LIBERO`;

        slot.onclick=()=>{
          selectedTime=time;
          selectedZone=zone;
          openModal();
        };
      }

      container.appendChild(slot);

    });

    m+=30;
    if(m==60){m=0;h++;}
    if(h==20) break;
  }
}

// -------- MODAL --------
function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

// -------- SAVE --------
function saveBooking(){

  let t=document.getElementById("trasp").value;
  let d=document.getElementById("dest").value;

  if(!t||!d){ alert("Compila i campi"); return; }

  bookings.push({
    id:Date.now(),
    date:selectedDate,
    time:selectedTime,
    zone:selectedZone,
    trasp:t,
    dest:d
  });

  localStorage.setItem("bookings",JSON.stringify(bookings));

  closeModal();
  loadSlots();
}

// -------- DELETE --------
function deleteBooking(id){
  bookings=bookings.filter(x=>x.id!=id);
  localStorage.setItem("bookings",JSON.stringify(bookings));
  loadSlots();
}

// START
createCalendar();

</script>

</body>
</html>
