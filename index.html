<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Baie</title>

<style>
body {margin:0;font-family:Arial;background:#eef2f7;}
header {background:#1e3a8a;color:white;text-align:center;padding:15px;}

.container {padding:10px;}

.calendar {
 display:flex;
 gap:10px;
 overflow-x:auto;
 margin-bottom:10px;
}

.day {
 min-width:70px;
 background:white;
 padding:10px;
 text-align:center;
 border-radius:10px;
 cursor:pointer;
}

.day.active {
 background:#1e3a8a;
 color:white;
}

.grid {
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.slot {
 padding:15px;
 border-radius:10px;
 text-align:center;
}

.free {background:#bbf7d0;}
.busy {background:#fecaca;}

button {
 margin-top:5px;
 padding:8px;
 width:100%;
 border:none;
 background:#1e3a8a;
 color:white;
}

.modal {
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 justify-content:center;
 align-items:center;
}

.box {
 background:white;
 padding:20px;
 border-radius:10px;
 width:90%;
 max-width:300px;
}

.box input {
 width:100%;
 padding:10px;
 margin-top:10px;
}
</style>

</head>

<body>

<header>Gestione Baie</header>

<div class="container">
  <div id="calendar" class="calendar"></div>
  <div id="slots" class="grid"></div>
</div>

<div id="modal" class="modal">
  <div class="box">
    <h3>Prenota</h3>
    <input id="trasp" placeholder="Trasportatore">
    <input id="dest" placeholder="Destinazione">
    <button onclick="save()">Salva</button>
    <button onclick="closeModal()">Chiudi</button>
  </div>
</div>

<script>

/* ✅ QUI CAMBI SOLO QUESTO */
const DB_URL = "https://api.jsonbin.io/v3/b/YOUR_ID/latest";

/* ---------- */

let selectedDate="", selectedTime="", selectedZone="";
let bookings=[];

// CALENDARIO
function calendar(){
 let cal=document.getElementById("calendar");
 cal.innerHTML="";
 let today=new Date();

 for(let i=0;i<10;i++){
  let d=new Date();
  d.setDate(today.getDate()+i);

  let div=document.createElement("div");
  div.className="day";
  div.innerText=d.getDate();

  if(d.getDay()!=0 && d.getDay()!=6){
    div.onclick=()=>{
      selectedDate=d.toISOString().split("T")[0];
      document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));
      div.classList.add("active");
      load();
    };
  } else {
    div.style.opacity="0.4";
  }

  cal.appendChild(div);
 }
}

// CARICA DATI DAL "DATABASE"
async function getData(){
 try{
  let res = await fetch(DB_URL);
  let json = await res.json();
  bookings = json.record || [];
 } catch {
  bookings = [];
 }
}

// SALVA DATI
async function saveData(){
 await fetch(DB_URL.replace("/latest",""), {
  method:"PUT",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify(bookings)
 });
}

// SLOT
async function load(){

 await getData();

 let cont=document.getElementById("slots");
 cont.innerHTML="";

 let h=6,m=0;

 while(true){

  let time=h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0");

  ["Fogli","Scatole"].forEach(zone=>{

    let div=document.createElement("div");

    let b=bookings.find(x=>x.date==selectedDate && x.time==time && x.zone==zone);

    if(b){
      div.className="slot busy";
      div.innerHTML=`${b.trasp}<br>${b.dest}
      <button onclick="del(${b.id})">🗑</button>`;
    } else {
      div.className="slot free";
      div.innerHTML=`${time}<br>${zone}<br>LIBERO`;
      div.onclick=()=>{
        selectedTime=time;
        selectedZone=zone;
        openModal();
      };
    }

    cont.appendChild(div);
  });

  m+=30;
  if(m==60){m=0;h++;}
  if(h==20) break;
 }
}

// SALVA PRENOTAZIONE
async function save(){

 let t=document.getElementById("trasp").value;
 let d=document.getElementById("dest").value;

 if(!t||!d){alert("Compila");return;}

 bookings.push({
  id:Date.now(),
  date:selectedDate,
  time:selectedTime,
  zone:selectedZone,
  trasp:t,
  dest:d
 });

 await saveData();
 closeModal();
 load();
}

// CANCELLA
async function del(id){
 bookings=bookings.filter(x=>x.id!=id);
 await saveData();
 load();
}

function openModal(){
 document.getElementById("modal").style.display="flex";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

// START
calendar();

</script>

</body>
</html>
