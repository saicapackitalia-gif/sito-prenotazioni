<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prenotazione Carichi</title>

<style>
body {
  font-family: Arial;
  margin:0;
  background:#f4f4f4;
}

h1 {
  background:#0078D4;
  color:white;
  padding:15px;
  text-align:center;
}

.container {
  padding:10px;
}

#calendar {
  display:grid;
  grid-template-columns: repeat(7,1fr);
  gap:5px;
}

.day {
  background:white;
  padding:12px;
  border:1px solid #ccc;
  text-align:center;
  cursor:pointer;
  border-radius:5px;
}

.weekend {
  background:#eee;
  color:#999;
}

.selected {
  background:#0078D4;
  color:white;
}

#slots {
  margin-top:15px;
}

.slot {
  padding:10px;
  margin:5px 0;
  border-radius:5px;
}

.free {
  background:#c8f7c5;
  cursor:pointer;
}

.busy {
  background:#f7c5c5;
}
</style>
</head>

<body>

<h1>Prenotazione Carichi</h1>

<div class="container">

<div id="calendar"></div>

<div id="slots"></div>

</div>

<script>

let bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
let selectedDate = "";

// -------- CALENDARIO --------
function creaCalendario() {

  let cal = document.getElementById("calendar");
  cal.innerHTML = "";

  let oggi = new Date();
  let anno = oggi.getFullYear();
  let mese = oggi.getMonth();

  let giorni = new Date(anno, mese+1, 0).getDate();

  for(let i=1;i<=giorni;i++){

    let data = new Date(anno, mese, i);
    let div = document.createElement("div");

    div.innerText = i;
    div.className = "day";

    if(data.getDay()==0 || data.getDay()==6){
      div.classList.add("weekend");
    } else {
      div.onclick = function(){
        selectedDate = data.toISOString().split("T")[0];
        document.querySelectorAll(".day").forEach(d => d.classList.remove("selected"));
        div.classList.add("selected");
        creaSlot();
      };
    }

    cal.appendChild(div);
  }
}

// -------- SLOT --------
function creaSlot(){

  let container = document.getElementById("slots");
  container.innerHTML = "";

  let ora = 6;
  let minuti = 0;

  while(true){

    let time = String(ora).padStart(2,'0') + ":" + String(minuti).padStart(2,'0');

    ["Fogli","Scatole"].forEach(zona => {

      let div = document.createElement("div");

      let b = bookings.find(x =>
        x.date == selectedDate &&
        x.time == time &&
        x.zone == zona
      );

      if(b){
        div.className = "slot busy";
        div.innerHTML = "<b>"+b.trasportatore+"</b><br>"+b.destinazione;
      } else {
        div.className = "slot free";
        div.innerText = time + " - " + zona + " (LIBERO)";
        div.onclick = function(){
          prenota(time, zona);
        };
      }

      container.appendChild(div);

    });

    minuti +=30;
    if(minuti==60){ minuti=0; ora++; }

    if(ora==20) break;
  }
}

// -------- PRENOTA --------
function prenota(time, zona){

  if(!selectedDate){
    alert("Seleziona un giorno");
    return;
  }

  let t = prompt("Trasportatore:");
  if(!t) return;

  let d = prompt("Destinazione:");
  if(!d) return;

  bookings.push({
    date: selectedDate,
    time: time,
    zone: zona,
    trasportatore: t,
    destinazione: d
  });

  localStorage.setItem("bookings", JSON.stringify(bookings));

  creaSlot();
}

// AVVIO
creaCalendario();

</script>

</body>
</html>
